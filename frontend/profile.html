<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="profile-container">
        <div class="group-profile">
            <!-- Заголовок с аватаркой -->
            <div class="profile-header">
                <div class="header-background"></div>
                <div class="avatar-container">
                    <img id="profileAvatar" src="" alt="Аватар" class="avatar-image">
                </div>
            </div>

            <!-- Основная информация -->
            <div class="profile-content">
                <div class="profile-info">
                    <div class="info-main">
                        <h1 id="profileName" class="group-name"></h1>
                        
                        <!-- Для групп -->
                        <div id="groupInfo" class="hidden">
                            <div class="member-count">
                                <i class="fas fa-users count-icon"></i>
                                <span id="memberCount" class="count-text"></span>
                            </div>
                        </div>
                        
                        <!-- Для пользователей -->
                        <div id="userInfo" class="hidden">
                            <div class="username-section">
                                <i class="fas fa-at count-icon"></i>
                                <span id="userUsername" class="count-text"></span>
                            </div>
                        </div>
                    </div>
                    
                    <button id="editBtn" class="edit-btn hidden">
                        <i class="fas fa-edit btn-icon"></i>Редактировать
                    </button>
                    
                    <button id="messageBtn" class="message-btn hidden">
                        <i class="fas fa-comment btn-icon"></i>Написать
                    </button>
                </div>

                <!-- Описание -->
                <div id="bioSection" class="bio-section hidden">
                    <p id="profileBio" class="bio-text"></p>
                </div>

                <!-- Секция участников (только для групп) -->
                <div id="membersSection" class="members-section hidden">
                    <h3 class="section-title">
                        <i class="fas fa-users title-icon"></i>
                        Участники группы
                    </h3>
                    
                    <div id="membersList" class="members-list">
                        <!-- Участники загружаются динамически -->
                    </div>
                </div>

                <!-- Действия для групп -->
                <div id="groupActions" class="actions-section hidden">
                    <button id="addMemberBtn" class="add-btn">
                        <i class="fas fa-plus btn-icon"></i>Добавить участника
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="dist/api.js"></script>
    <script type="module" src="dist/profile.js"></script>
</body>
</html>
