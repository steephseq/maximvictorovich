<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Mess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/shared/base.css">
    <link rel="stylesheet" href="css/shared/animations.css">
    <link rel="stylesheet" href="css/shared/buttons.css">
    <link rel="stylesheet" href="css/shared/forms.css">
    <link rel="stylesheet" href="css/pages/register.css">
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <!-- Логотип -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="app-title">Регистрация</h1>
                <p class="app-subtitle">Создайте новый аккаунт</p>
            </div>

            <!-- Форма регистрации -->
            <form id="registerForm" class="register-form">
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" id="name" required class="register-input" placeholder="Полное имя">
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-at"></i>
                    </div>
                    <input type="text" id="username" required class="register-input" placeholder="Имя пользователя">
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input type="email" id="email" required class="register-input" placeholder="Email">
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="password" required class="register-input" placeholder="Пароль">
                    <button type="button" class="password-toggle" data-target="password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="confirmPassword" required class="register-input" placeholder="Подтвердите пароль">
                    <button type="button" class="password-toggle" data-target="confirmPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="terms-group">
                    <input type="checkbox" id="terms" required class="terms-checkbox">
                    <label for="terms" class="terms-label">
                        Я соглашаюсь с <a href="#" class="terms-link">условиями использования</a>
                    </label>
                </div>

                <button type="submit" class="register-btn">
                    <span class="btn-text">Зарегистрироваться</span>
                    <div class="btn-loader hidden">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </button>
            </form>

            <!-- Сообщения -->
            <div id="message" class="message hidden"></div>

            <!-- Ссылка на логин -->
            <div class="login-section">
                <p class="login-text">Уже есть аккаунт?</p>
                <a href="index.html" class="login-link">
                    Войти
                </a>
            </div>
        </div>

        <!-- Декоративные элементы -->
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script type="module" src="dist/register.js"></script>
</body>
</html>
