<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Group Chat</title>
<link rel="stylesheet" href="css/createGroup.css">
</head>
<body>
<div class="container">
    <h2>Create Group Chat</h2>
    <input type="text" id="groupName" placeholder="Group name" />

    <div class="search-section">
        <input type="text" id="searchUserInput" placeholder="Search users..." />
        <ul id="searchResults"></ul>
    </div>

    <h3>Selected Users:</h3>
    <ul id="selectedUsers"></ul>

    <button id="createGroupBtn">Create Group</button>
    <button id="backBtn">Back to Chats</button>
</div>

<script src="js/createGroup.js"></script>
</body>
</html>
