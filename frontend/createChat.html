<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Chat</title>
    <link rel="stylesheet" href="css/createChat.css">
</head>
<body>
    <div class="container">
        <h2>Create Chat</h2>

        <input type="text" id="chatName" placeholder="Enter chat name">

        <div>
            <label>
                <input type="checkbox" id="isGroup"> Group Chat
            </label>
        </div>

        <input type="text" id="searchUserInput" placeholder="Type username...">

        <div id="userList"></div>
        <h3>Selected Users:</h3>
<div id="selectedUsers" style="padding:5px; background: rgba(255,255,255,0.1); border-radius:5px;"></div>


        <button id="createChatBtn">Create Chat</button>
    </div>

    <script src="js/createChat.js"></script>
</body>
</html>
