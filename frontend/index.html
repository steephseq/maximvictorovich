<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Mess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Логотип -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                </div>
                <h1 class="app-title">MiV</h1>
                <p class="app-subtitle">Войдите в свой аккаунт</p>
            </div>

            <!-- Форма входа -->
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input type="email" id="email" required class="login-input" placeholder="Email">
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="password" required class="login-input" placeholder="Пароль">
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Войти</span>
                    <div class="btn-loader hidden">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </button>
            </form>

            <!-- Сообщения об ошибках -->
            <div id="errorMessage" class="error-message hidden"></div>

            <!-- Ссылка на регистрацию -->
            <div class="register-section">
                <p class="register-text">Нет аккаунта?</p>
                <a href="register.html" class="register-link">
                    Зарегистрироваться
                </a>
            </div>
        </div>

        <!-- Декоративные элементы -->
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script type="module" src="dist/auth.js"></script>
    <script type="module" src="dist/api.js"></script>
    <script type="module" src="dist/login.js"></script>
</body>
</html>
